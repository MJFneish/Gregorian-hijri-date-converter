# Hijri Converter for iOS — XcodeGen spec (`xcodegen generate` writes HijriConverter.xcodeproj, which
# is not committed). The engine and the app logic live in the HijriCore Swift package, tested on its
# own with `swift test`. Built and tested on GitHub Actions (.github/workflows/ci.yml) — there is no
# Xcode on the development machine.
name: HijriConverter
options:
  bundleIdPrefix: com.devlance
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    # Kept equal to android/version.properties by `yarn bump` (in android/); numeric only.
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "108"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  HijriCore:
    path: HijriCore

targets:
  HijriConverter:
    type: application
    platform: iOS
    sources:
      - path: HijriConverter
    dependencies:
      - package: HijriCore
    info:
      path: HijriConverter/Info.plist
      properties:
        CFBundleDisplayName: Hijri Converter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.hijriconverter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  HijriConverterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HijriConverterUITests
    dependencies:
      - target: HijriConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.hijriconverter.uitests
        TEST_TARGET_NAME: HijriConverter

schemes:
  HijriConverter:
    build:
      targets:
        HijriConverter: all
    test:
      targets:
        - HijriConverterUITests
